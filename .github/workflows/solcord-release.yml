name: Publish Solcord packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/common/solcord/product-identity.ts

permissions:
  contents: read

concurrency:
  group: solcord-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/solcord-ci.yml

  publish:
    name: Publish verified immutable packages
    needs: verify
    if: github.repository == 'celubos/Solcord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Download Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solcord-v2-installer-${{github.sha}}
          path: ${{runner.temp}}/packages/windows
      - name: Download Apple Silicon preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solcord-macos-arm64-${{github.sha}}
          path: ${{runner.temp}}/packages/macos-arm64
      - name: Download Intel preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solcord-macos-x64-${{github.sha}}
          path: ${{runner.temp}}/packages/macos-x64
      - name: Verify package provenance and assemble release
        run: bun scripts/prepare-solcord-release.ts "$RUNNER_TEMP/packages" "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - name: Publish only a new version
        env:
          GH_TOKEN: ${{github.token}}
        run: bun scripts/publish-solcord-release.ts "$RUNNER_TEMP/release" "$GITHUB_SHA"
