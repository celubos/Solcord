name: Import reviewed Solcord history

on: create

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'celubos/Solcord' && github.event.ref_type == 'branch' && github.event.ref == 'delivery/solcord-2.0.1-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed delivery
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Reassemble and verify immutable history
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/solcord-release.bundle"
          cat .delivery/history/part-*.bin > "$bundle"
          printf '%s  %s\n' 'b85b156a01e61313bf7397732c433b0c1b4cdd2ca68c050fe04e3306afa3b379' "$bundle" | sha256sum --check --strict
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = '6c7c8f19059fcc21d354952788545df62ecfb0d1'
          git merge-base --is-ancestor '9b3004ff8c25c9879803a6c07fa8b28d04731438' FETCH_HEAD
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = 'caffd9d1778168bf1ee25336d13ae30aebbfda4f'
          git push origin '6c7c8f19059fcc21d354952788545df62ecfb0d1:refs/heads/sol/release-2.0.1'
          test "$(git ls-remote origin refs/heads/sol/release-2.0.1 | cut -f1)" = '6c7c8f19059fcc21d354952788545df62ecfb0d1'

