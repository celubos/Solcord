name: Solcord V2 CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "development", "fork/**", "v2/**", "audit/**"]
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and production package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Test
        run: bun run test
      - name: Lint TypeScript
        run: bun run lint
      - name: Lint Solcord CSS
        run: bun run lint-css:solcord
      - name: Check all styles against reviewed CSS debt
        run: bun run lint-css:baseline
      - name: Typecheck
        run: bun run typecheck
      - name: Generate public compatibility types
        run: bun run generate-types
      - name: Check circular dependencies
        run: bun run circulars
      - name: Check documentation links
        run: bun run check:docs
      - name: Check repository inventory
        run: bun run audit:repo:check
      - name: Build and package
        run: bun run dist
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}
      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solcord-review-${{github.sha}}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/solcord.asar
            dist/checksums.txt
            dist/solcord-build-manifest.json

      - name: Upload compatibility ASAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{github.event_name == 'pull_request'}}
        with:
          name: solcord-asar-${{github.sha}}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: dist/solcord.asar
      - name: Upload compatibility checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{github.event_name == 'pull_request'}}
        with:
          name: solcord-checksums-${{github.sha}}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: dist/checksums.txt

  build:
    name: build
    needs: verify
    if: ${{always()}}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the compatibility build gate
        env:
          SOURCE_RESULT: ${{needs.verify.result}}
        run: test "$SOURCE_RESULT" = success

  windows-policy:
    name: Windows policy, safety, and installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Prepare .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.424
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run Windows-sensitive fixtures
        run: bun test --isolate tests/electron/preload-policy.test.ts tests/electron/original-preload.test.ts tests/solcord/safety.test.ts tests/solcord/settings.test.ts tests/solcord/disposable-acceptance.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Test installer recovery across process restarts
        shell: pwsh
        run: dotnet run --project tests/installer/RecoveryTests.csproj --configuration Release "-p:BaseIntermediateOutputPath=$env:RUNNER_TEMP\solcord-recovery-obj\" "-p:BaseOutputPath=$env:RUNNER_TEMP\solcord-recovery-bin\"
      - name: Build self-contained installer candidate
        shell: pwsh
        run: bun run installer:candidate -- dist/solcord.asar "$env:RUNNER_TEMP\solcord-v2-installer" "$env:GITHUB_SHA"
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}
      - name: Upload Windows installer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solcord-v2-installer-${{github.sha}}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{runner.temp}}/solcord-v2-installer
