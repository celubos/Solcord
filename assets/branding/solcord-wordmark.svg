<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-labelledby="title description">
  <title id="title">Solcord</title>
  <desc id="description">Solcord mark and wordmark on a transparent background.</desc>
  <g transform="translate(16 16) scale(2)">
    <defs>
        <linearGradient id="wordmark-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2cc7b3"/>
          <stop offset="1" stop-color="#0a5a54"/>
        </linearGradient>
        <radialGradient id="wordmark-spark" cx="32" cy="32" r="4.2" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffd08a"/>
          <stop offset="1" stop-color="#ff6a3d"/>
        </radialGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#wordmark-tile)"/>
      <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <g fill="none" stroke-linecap="round" stroke-width="7.6">
        <path d="M40.2 15.7A10.5 10.5 0 1 0 25.7 30.6" stroke="#ffffff"/>
        <path d="M38.3 33.4A10.5 10.5 0 1 1 23.8 48.3" stroke="#fff1de"/>
      </g>
      <circle cx="32" cy="32" r="5.9" fill="url(#wordmark-tile)"/>
      <circle cx="32" cy="32" r="3.3" fill="url(#wordmark-spark)"/>
  </g>
  <text x="176" y="105" fill="#171a1c" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Solcord</text>
  <path d="M180 122H405" stroke="#2cc7b3" stroke-width="4"/>
  <path d="M405 122H443" stroke="#ff6a3d" stroke-width="4"/>
</svg>
