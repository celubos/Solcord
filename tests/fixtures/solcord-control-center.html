<!doctype html>
<html lang="en" data-solcord-mode="solcord-dark" data-solcord-accent="glacier" data-solcord-density="comfortable" data-solcord-message-shape="discord" data-solcord-motion="subtle" data-solcord-effective-motion="subtle">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solcord Control Center fixture</title>
    <script>
        (() => {
            const params = new URLSearchParams(location.search);
            const root = document.documentElement;
            root.dataset.solcordMode = params.get("mode") || "solcord-dark";
            root.dataset.solcordAccent = params.get("accent") || "glacier";
            root.dataset.solcordDensity = params.get("density") || "comfortable";
            root.dataset.solcordMessageShape = params.get("shape") || "discord";
            root.dataset.solcordMotion = params.get("motion") || "subtle";
            root.dataset.solcordEffectiveMotion = params.get("motion") || "subtle";
            root.dataset.solcordFixtureScale = params.get("scale") || "100";
            root.dataset.solcordFixtureTheme = params.get("theme") || "none";
            const themes = {
                "solcord-default": "Solcord-Default.theme.css",
                "obsidian-thread": "Solcord-ObsidianThread.theme.css",
                "carbon-ember": "Solcord-CarbonEmber.theme.css",
                "midnight-glass": "Solcord-MidnightGlass.theme.css",
                "paper-signal": "Solcord-PaperSignal.theme.css",
                "threadline": "Solcord-Threadline.theme.css",
                "signal-block": "Solcord-SignalBlock.theme.css",
                "relay-classic": "Solcord-RelayClassic.theme.css",
                "workshop": "Solcord-Workshop.theme.css",
                "quiet-read": "Solcord-QuietRead.theme.css",
                "night-transit": "Solcord-NightTransit.theme.css"
            };
            window.__solcordFixtureThemeFile = themes[params.get("theme")] || "";
        })();
    </script>
    <link rel="stylesheet" href="../../src/betterdiscord/styles/solcord.css">
    <script>
        if (window.__solcordFixtureThemeFile) document.write(`<link rel="stylesheet" href="../../assets/themes/${window.__solcordFixtureThemeFile}">`);
    </script>
    <style>
        :root {
            --font-primary: "Solcord Hanken", "Segoe UI", sans-serif;
            --font-display: var(--font-primary);
            --font-code: "Cascadia Code", Consolas, monospace;
            --brand-500: #5865f2;
            --brand-560: #4752c4;
            --green-360: #23a55a;
            --status-danger: #da373c;
            --button-filled-brand-background: #5865f2;
            --button-filled-brand-background-hover: #4752c4;
        }
        html, body { min-width: 0; min-height: 100%; margin: 0; }
        body {
            --background-primary: #313338;
            --background-secondary: #2b2d31;
            --background-secondary-alt: #232428;
            --background-tertiary: #1e1f22;
            --background-floating: #111214;
            --background-modifier-hover: rgb(255 255 255 / 6%);
            --background-modifier-active: rgb(255 255 255 / 9%);
            --background-modifier-selected: rgb(255 255 255 / 12%);
            --background-modifier-accent: rgb(255 255 255 / 10%);
            --border-subtle: rgb(255 255 255 / 12%);
            --border-strong: rgb(255 255 255 / 26%);
            --text-normal: #dbdee1;
            --text-muted: #a5abb4;
            --text-link: #00a8fc;
            --header-primary: #f2f3f5;
            --header-secondary: #b5bac1;
            --interactive-normal: #b5bac1;
            --interactive-hover: #dbdee1;
            --interactive-active: #ffffff;
            --interactive-muted: #5d6169;
            --input-background: #1e1f22;
            color: var(--text-normal);
            background: var(--background-tertiary);
            font: 14px/1 var(--font-primary);
        }
        h1, h2, h3, p { margin: 0; }
        button, input, select, textarea { font: inherit; }
        #app-mount { min-height: 100vh; background: var(--background-tertiary); }
        .fixture-shell { box-sizing: border-box; width: min(100%, 1240px); min-height: 100vh; margin: 0 auto; padding: 22px 24px 48px; background: var(--background-primary); }
        .fixture-mark { width: 100%; height: 100%; object-fit: contain; }
        .fixture-only { position: fixed; left: -10000px; top: 0; }
        @media (max-width: 520px) { .fixture-shell { padding: 0; } }
        /* dialog=1 mirrors Discord's modal layer and BetterDiscord's .bd-modal-root (styles/ui/modal.css). */
        .fixture-modal-layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / 70%); }
        .bd-modal-root { position: relative; display: flex; flex-direction: column; max-height: 100%; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: 8px; }
    </style>
</head>
<body>
<div id="app-mount" class="theme-dark">
    <div class="fixture-shell">
        <main class="solcord-panel solcord-density-comfortable solcord-motion-subtle" data-critical="panel">
            <header class="solcord-header" data-critical="header">
                <div class="solcord-mark" aria-hidden="true"><img class="fixture-mark" src="../../assets/branding/solcord-mark.svg" alt=""></div>
                <div class="solcord-header-copy"><h1>Solcord</h1><p>Control Center</p></div>
            </header>
            <div class="solcord-control-center" data-critical="control-center">
                <nav class="solcord-workspace-nav" aria-label="Solcord settings" data-critical="navigation">
                    <label class="solcord-workspace-search"><span class="sr-only">Filter Solcord settings</span><input type="search" placeholder="Find a setting"></label>
                    <div class="solcord-workspace-nav-list">
                        <section aria-label="Start"><p>Start</p><button type="button" data-workspace="overview"><strong>Overview</strong></button></section>
                        <section aria-label="Personalize"><p>Personalize</p><button type="button" data-workspace="appearance"><strong>Appearance &amp; Accessibility</strong></button><button type="button" data-workspace="performance"><strong>Performance</strong></button></section>
                        <section aria-label="Features"><p>Features</p><button type="button" data-workspace="privacy"><strong>Privacy &amp; Safety</strong></button><button type="button" data-workspace="chat"><strong>Chat &amp; Composer</strong></button><button type="button" data-workspace="history"><strong>Message History</strong></button><button type="button" data-workspace="voice"><strong>Voice &amp; Activities</strong></button><button type="button" data-workspace="friends"><strong>Friends &amp; Spaces</strong></button></section>
                        <section aria-label="System"><p>System</p><button type="button" data-workspace="extensions"><strong>Extensions</strong></button><button type="button" data-workspace="recovery"><strong>Recovery</strong></button></section>
                    </div>
                    <details class="solcord-workspace-menu"><summary aria-label="Change workspace. Current workspace: Overview">Workspace: Overview</summary><div><button type="button" data-workspace="overview">Overview</button><button type="button" data-workspace="appearance">Appearance &amp; Accessibility</button><button type="button" data-workspace="performance">Performance</button><button type="button" data-workspace="privacy">Privacy &amp; Safety</button><button type="button" data-workspace="chat">Chat &amp; Composer</button><button type="button" data-workspace="history">Message History</button><button type="button" data-workspace="voice">Voice &amp; Activities</button><button type="button" data-workspace="friends">Friends &amp; Spaces</button><button type="button" data-workspace="extensions">Extensions</button><button type="button" data-workspace="recovery">Recovery</button></div></details>
                </nav>
                <div id="workspace" class="solcord-workspace" data-critical="workspace"></div>
            </div>
        </main>
    </div>
</div>
<pre id="fixture-result" class="fixture-only" aria-hidden="true"></pre>
<script>
    const params = new URLSearchParams(location.search);
    const workspace = params.get("workspace") || "overview";
    const state = params.get("state") || "healthy";
    const diagnostic = params.get("diagnostic") === "1";
    const switchMatrix = params.get("switches") === "1";
    const longCopy = params.get("long") === "1";
    const fixtureWidth = Number(params.get("fixtureWidth"));
    if (Number.isFinite(fixtureWidth) && fixtureWidth >= 280) document.querySelector(".fixture-shell").style.width = `${fixtureWidth}px`;
    if (diagnostic) document.querySelector(".solcord-header-copy").insertAdjacentHTML("beforeend", `<span class="solcord-build-warning" role="status">Diagnostic build</span>`);
    // Mirrors the production Control Center dialog (src/betterdiscord/ui/settings.tsx):
    // one title row with the identity and Close, then the scrolling panel.
    const dialogMode = params.get("dialog") === "1";
    if (dialogMode) {
        const layer = document.createElement("div");
        layer.className = "fixture-modal-layer";
        layer.innerHTML = `<div role="dialog" aria-modal="true" class="bd-modal-root solcord-control-center-dialog"><div class="solcord-control-center-dialog-header"><div class="solcord-control-center-dialog-title"><span class="solcord-mark" aria-hidden="true"><img class="fixture-mark" src="../../assets/branding/solcord-mark.svg" alt=""></span><h2>Solcord <span>Control Center</span></h2>${diagnostic ? `<span class="solcord-build-warning" role="status">Diagnostic build</span>` : ""}</div><button type="button" aria-label="Close Solcord settings">Close</button></div><div class="solcord-control-center-dialog-content"></div></div>`;
        layer.querySelector(".solcord-control-center-dialog-content").append(document.querySelector(".solcord-panel"));
        document.querySelector(".fixture-shell").replaceWith(layer);
    }
    const content = document.querySelector("#workspace");
    const workspaceNames = {
        overview: ["Overview", "Current state and the next useful action."],
        appearance: ["Appearance & Accessibility", "Make Discord easier to read and comfortable to use."],
        performance: ["Performance", "Choose how much optional work Solcord does."],
        privacy: ["Privacy & Safety", "Control optional outbound data and local privacy tools."],
        chat: ["Chat & Composer", "Writing, replies, previews, and local draft tools."],
        history: ["Message History", "Deleted and edited messages Solcord saw, stored only on this computer."],
        voice: ["Voice & Activities", "Call context, Activity compatibility, and manually armed experiments."],
        friends: ["Friends & Spaces", "Local organization and opt-in relationship history."],
        extensions: ["Extensions", "Optional community software and migration tools."],
        recovery: ["Recovery", "Backups, rollback, setup, and focused diagnostics."]
    };
    const action = (label, tone = "neutral") => `<button type="button" class="solcord-action solcord-action-${tone}">${label}</button>`;
    const switchControl = (title, checked = false, disabled = false) => `<span class="solcord-switch"><input type="checkbox" role="switch" aria-label="${title}" aria-checked="${checked}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}><span class="solcord-switch-track" aria-hidden="true"><span class="solcord-switch-thumb"></span></span></span>`;
    const toggle = (title, copy, checked = false) => `<div class="solcord-setting-row" data-critical="row"><span><strong>${title}</strong><small>${copy}</small></span>${switchControl(title, checked)}</div>`;
    const heading = (id) => `<header class="solcord-workspace-heading" data-critical="workspace-heading"><h2 tabindex="-1">${workspaceNames[id][0]}</h2><p>${workspaceNames[id][1]}</p></header>`;
            const section = (title, summary, body) => `<section class="solcord-section"><div class="solcord-section-heading"><h3>${title}</h3>${summary ? `<p>${summary}</p>` : ""}</div>${body}</section>`;
    const allClear = `<div class="solcord-all-clear" role="status"><strong>All clear</strong><span>Protection is active and no action is needed.</span></div>`;
    const fakeDeafenSection = section("Fake Deafen", "A direct built-in control beside Discord's normal Deafen button.", `<div class="solcord-power-control"><div><span class="solcord-status solcord-status-idle">off</span><p>Turn it on here, then use the F button next to Deafen in a call.</p></div>${switchControl("Keep Fake Deafen adapter ready")}</div><p class="solcord-key-hint">In a voice call, use the <strong>F</strong>-badged button immediately beside normal Deafen. One click turns Fake Deafen on; the next click restores normal voice state. There is no per-call confirmation.</p><dl class="solcord-facts" aria-label="Your voice state"><div><dt>Your deafened icon</dt><dd>Not available yet</dd></div><div><dt>Local deafen</dt><dd>Off</dd></div><div><dt>Discord self-deafen</dt><dd>Unknown</dd></div><div><dt>Server deafen</dt><dd>Unknown</dd></div></dl><p class="solcord-key-hint">Discord values are the latest observed state for your current call. They do not confirm a fresh Discord response or audio playback.</p><p class="solcord-key-hint">While Fake Deafen is on, your voice-row icon follows the deafened state received from Discord. Local audio stays undeafened.</p><details class="solcord-secondary-tools"><summary>Behavior and automatic cleanup</summary><p>Restores or disarms on disconnect, channel change, account change, drift, recovery, or disable.</p></details>`);

    // Mirrors the production Message History panel markup (src/betterdiscord/ui/solcord/timeline.tsx).
    const historyText = longCopy ? "A deliberately long saved message that wraps across several lines in a narrow window, includes an unbroken token like https://example.invalid/very/long/path/that/must/wrap/without/overflowing, and keeps every line readable." : "See you at 7, bring the charger.";
    const historyEntry = (author, where, badges, text, versions) => `<li><article class="solcord-history-entry${badges.includes("Deleted") ? " solcord-history-deleted" : ""}" aria-label="${author}"><header><span class="solcord-history-badges">${badges.map(badge => `<span class="solcord-history-badge solcord-history-badge-${badge.startsWith("Deleted") ? "deleted" : badge.startsWith("Edited") ? "edited" : "ghost"}">${badge}</span>`).join("")}</span><h4>${author}</h4><span class="solcord-history-where">${where}</span></header><dl class="solcord-history-times"><div><dt>First seen</dt><dd><time>Nov 14, 2026, 9:41 AM</time></dd></div>${badges.includes("Deleted") ? `<div><dt>Deleted</dt><dd><time>Nov 14, 2026, 9:58 AM</time></dd></div>` : ""}</dl><p class="solcord-history-text">${text}</p>${versions ? `<details class="solcord-history-versions" open><summary>Show the earlier version</summary><ol><li><span class="solcord-history-version-label">Original · <time>Nov 14, 2026, 9:41 AM</time></span><p>${versions}</p></li></ol></details>` : ""}<div class="solcord-history-actions">${action("Open conversation")}</div></article></li>`;
    const historyScreen = () => `<section class="solcord-section solcord-history" aria-labelledby="solcord-history-title"><div class="solcord-history-intro"><div class="solcord-history-switch"><div><h3 id="solcord-history-title">Deleted &amp; Edited Messages</h3><p>On · saving direct messages and group DMs.</p></div>${switchControl("Save deleted and edited messages", true)}</div><p>When this is on, Solcord keeps a private copy of messages it sees in the conversations you choose. If someone later deletes or edits one, you can still read it here. It cannot recover messages deleted before Solcord saw them, and it never reads hidden channels or fetches old history.</p><dl class="solcord-facts solcord-history-facts"><div><dt>Stored</dt><dd>Saved only on this computer, never uploaded. Each saved event is encrypted with AES-256-GCM, and its key is protected by your system's secure storage.</dd></div><div><dt>Kept for</dt><dd>7 days after Solcord first sees each message. At most 10,000 saved events per account; the oldest are removed first.</dd></div><div><dt>Saved now</dt><dd>3 messages (1 deleted · 1 edited · 0 ghost pings) · 1.2 KiB of text</dd></div></dl></div><div class="solcord-history-toolbar"><div class="solcord-history-filters" role="group" aria-label="Show">${[["Deleted & edited", 2, true], ["Deleted", 1], ["Edited", 1], ["Ghost pings", 0], ["Everything saved", 3]].map(([label, count, pressed]) => `<button type="button" aria-pressed="${pressed === true}">${label} <span class="solcord-history-count">${count}</span></button>`).join("")}</div><div class="solcord-history-search"><label>Search<input type="search" placeholder="Text, name, or file name"></label><label>Conversation<select><option>All conversations</option></select></label><label>Order<select><option>Newest activity first</option></select></label></div></div><p class="solcord-history-summary">Showing 2 of 2</p><ol class="solcord-history-list" aria-label="Saved messages">${historyEntry("Ana", "Direct message · Ana", ["Deleted"], historyText)}${historyEntry("Ben Long-Display-Name-For-Wrapping", "#general · A server with a long name", ["Edited once"], "Meet at 8 instead.", "Meet at 7.")}</ol><details class="solcord-secondary-tools"><summary>What gets saved</summary><div class="solcord-history-settings"><label>Keep history for<select><option>7 days</option></select></label><label>Save<select><option>Text only</option></select></label><label>Versions shown per message<select><option>10</option></select></label></div></details><details class="solcord-secondary-tools" open><summary>Export or erase</summary><p>Export saves a readable JSON copy of this account's saved history through Discord's download prompt. Erase permanently deletes this account's saved history from this computer. Turning Message History off does not erase anything.</p><div class="solcord-history-actions">${action("Export…")}${action("Erase history…", "danger")}</div></details></section>`;
    const screens = {
        overview: () => `${heading("overview")}${state === "setup" ? `<div class="solcord-setup-reminder"><span><strong>Setup is saved for later.</strong><small>Nothing changed. Resume whenever you are ready.</small></span>${action("Resume")}</div>` : ""}${section("Right now", "", state === "degraded" ? `<div class="solcord-pulse-list"><div class="solcord-pulse solcord-pulse-attention"><div><strong>Privacy adapter needs review</strong><p>Optional telemetry remains blocked while Solcord waits for a verified client surface.</p></div>${action("Review")}</div></div>` : `<div class="solcord-all-clear" role="status"><strong>All clear</strong><span>Nothing needs your attention. Use the search above to jump to any setting.</span></div>`)}`,
        appearance: () => `${heading("appearance")}${section("Theme", "Changes preview immediately and can be reset without a restart.", `<div class="solcord-appearance-controls"><label>Mode<select><option>Solcord Dark</option><option>Solcord Light</option><option>OLED</option></select></label><label>Density<select><option>Comfortable</option><option>Compact</option></select></label><fieldset class="solcord-effect-color"><legend>Effect color</legend><div role="radiogroup" aria-label="Effect color"><button type="button" role="radio" aria-checked="true" aria-label="Use Glacier effect color"><i aria-hidden="true" style="background-color:#9fb8ff"></i><span>Glacier</span></button><button type="button" role="radio" aria-checked="false" aria-label="Use Oxidized teal effect color"><i aria-hidden="true" style="background-color:#76a891"></i><span>Oxidized teal</span></button><button type="button" role="radio" aria-checked="false" aria-label="Use Ember effect color"><i aria-hidden="true" style="background-color:#ff755f"></i><span>Ember</span></button></div></fieldset></div><p class="solcord-save-status" role="status">Saved</p><div class="solcord-live-preview solcord-mode-${document.documentElement.dataset.solcordMode}"><span>Appearance preview</span><strong>Readable hierarchy at every density.</strong><small>Focus, warning, success, and danger remain distinct.</small>${action("Keyboard focus sample")}</div>`)}${section("Accessibility", "Motion, contrast, and message shape stay under your control.", `<div class="solcord-setting-list">${toggle("Reduced motion", "Stops decorative transitions and follows the Windows preference.", params.get("motion") === "reduced")}${toggle("Reading ruler", "Keeps a restrained local focus line under the current message.")}${toggle(longCopy ? "Use a deliberately long localized accessibility label to prove that the control remains visible without horizontal overflow" : "Role contrast repair", "Improves hard-to-read role colors without changing identity cues.", true)}</div>`)}`,
        performance: () => `${heading("performance")}${section("Performance profile", "Choose how much background work and motion Solcord may use.", `<div class="solcord-segmented" role="radiogroup"><button role="radio"><strong>Lean</strong><small>Minimum background work and no ambient motion.</small></button><button role="radio" aria-checked="true"><strong>Balanced</strong><small>Responsive controls with short interaction-led motion.</small></button><button role="radio"><strong>Visual</strong><small>Full interaction motion while keeping chat and long lists still.</small></button></div>`)}${section("Performance HUD", "Shows how hard Solcord is working, measured on this computer and only while the overlay is open.", `<label><span>${longCopy ? "Show the local performance overlay with a deliberately long translated label that must wrap without covering the keyboard shortcut below it" : "Show the local performance overlay"}</span>${switchControl("Show the local performance overlay")}</label><p class="solcord-key-hint">When the overlay is hidden, it stops measuring completely. <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>K</kbd> opens Command Deck.</p>`)}`,
        privacy: () => `${heading("privacy")}${section("Strict Privacy", "Blocks Discord's optional tracking while chat, voice, and login keep working.", `<div class="solcord-privacy-command"><div><strong>${state === "degraded" ? "Needs review" : "Protected"}</strong><p>${state === "degraded" ? "A Discord update changed one optional tracking path. Solcord still blocks every path it knows." : "Analytics, optional crash reports, activity discovery, and automatic Solcord checks are off."}</p></div>${action("Check now")}</div><div class="solcord-privacy-capabilities"><div><span>Telemetry<small>Discord analytics and science reporting.</small></span><strong class="solcord-privacy-state solcord-privacy-state-protected">Protected</strong></div><div><span>Crash reporting<small>Optional error and crash uploads.</small></span><strong class="solcord-privacy-state solcord-privacy-state-${state === "degraded" ? "degraded" : "protected"}">${state === "degraded" ? "Degraded" : "Protected"}</strong></div><div><span>Core Discord<small>Authentication, chat, voice, media, moderation, and security updates.</small></span><strong class="solcord-privacy-state solcord-privacy-state-unsupported">Allowed</strong></div></div>`)}${section("Safety tools", "Local checks before you open a link or upload a file. Nothing is sent anywhere.", `<div class="solcord-control-grid"><label><span>Review links before opening them (Link Lens)</span>${switchControl("Review links before opening them", true)}</label><label><span>Review files before uploading them</span>${switchControl("Review files before uploading them")}</label></div>`)}`,
        chat: () => `${heading("chat")}${section("Composer Toolkit", "Small, reversible writing aids with no automatic sends.", `<div class="solcord-setting-list">${toggle("Double-click to reply", "Starts a normal Discord reply from an observed message.", true)}${toggle("Character counter", "Shows draft length without storing message text.", true)}${toggle("Guarded message split", "Previews bounded chunks for manual copy and confirmation.")}</div>`)}${section("Draft tools", "Everything remains local and explicit.", `<label class="solcord-field">Composer sandbox<textarea rows="4">A local preview that is never sent automatically.</textarea></label>`)}`,
        history: () => `${heading("history")}${historyScreen()}`,
        voice: () => `${heading("voice")}${section("Call Context", "Handy details about the call you are in.", `<div class="solcord-setting-list">${toggle("Call timer", "Shows the current call duration.", true)}${toggle("Voice activity context", "Shows who is talking, from what Discord already loaded.", true)}</div>`)}${fakeDeafenSection}${section("Stream Audience Guard", "Stop your own Go Live when a denied user is detected.", `
            <div class="solcord-audience-command"><div><strong>Your stream will not start or continue while a denied user is detected in the current call or viewer list.</strong><p>Only native private-channel permissions are server-enforced. Stop on Watch cannot rule out brief frame exposure.</p></div><span class="solcord-status">Off</span></div>
            <div class="solcord-inline-field solcord-audience-add"><input placeholder="Discord user ID" aria-label="Denied Discord user ID"><input placeholder="Private label (optional)" aria-label="Private label for denied user"><button type="button" class="solcord-action" disabled>Add locally</button></div>
            <p class="solcord-empty">No denied users are stored for this Discord account.</p>
            <div class="solcord-actions"><button type="button" class="solcord-action solcord-action-accent" disabled>Arm for this call</button><button type="button" class="solcord-action solcord-action-danger" disabled>Clear private list</button></div>
            <p class="solcord-key-hint">Encrypted storage is available. Enable the adapter while signed in to load this account's private list. Audience Guard is off.</p>
        `)}`,
        friends: () => `${heading("friends")}${section("Friend Watch", "Opt-in relationship transitions from already-loaded state.", `<p class="solcord-privacy-summary">No messages, no network polling, and no guesses about who blocked whom.</p><div class="solcord-setting-list">${toggle("Keep relationship history", "Account-isolated encrypted local history with a clear retention limit.")}${toggle("Local summary", "Shows one bounded in-app summary after a new transition.")}</div>`)}${section("People & Spaces", "Local organization that never edits Discord servers or profiles.", `<div class="solcord-setting-list">${toggle("Pinned DMs", "Keep chosen conversations easy to reach.", true)}${toggle("Server aliases", "Private names stored only on this device.")}</div>`)}`,
        extensions: () => `${heading("extensions")}<div class="solcord-all-clear"><strong>Built-ins live with their features</strong><span>Message, voice, privacy, and people tools are managed in the matching workspace.</span></div><div class="solcord-native-ledger" aria-label="Built-in feature summary"><div class="solcord-native-row" data-native-layout><strong class="solcord-native-title">Composer Toolkit</strong><small class="solcord-native-replaces">Replaces CharCounter, CompleteTimestamps, DoubleClickToReply, and guarded SplitLargeMessages</small><span class="solcord-capability solcord-capability-ready">Ready</span></div><div class="solcord-native-row" data-native-layout><strong class="solcord-native-title">People and Spaces</strong><small class="solcord-native-replaces">Replaces BetterFriendList, PinDMs, ServerHider, ServerDetails, and local-only Server Aliases without editing Discord</small><span class="solcord-capability solcord-capability-ready">Ready</span></div></div><details class="solcord-extension-disclosure"><summary>Community plugins</summary><p>Optional plugins, migration, and troubleshooting details stay here until you need them.</p>${section("Provider migration", "A separate, reversible transaction with a verified rollback preview.", `<div class="solcord-setting-row"><span><strong>Duplicate providers</strong><small>No files move until preview and confirmation.</small></span>${action("Preview")}</div>`)}</details>`,
        recovery: () => `${heading("recovery")}${section("Setup", "Resume, rerun, or roll back first setup.", `<div class="solcord-setup-management"><div><strong>${state === "setup" ? "Setup saved for later" : "Setup complete"}</strong><p>Existing plugins, themes, and settings remain protected.</p></div><div class="solcord-actions">${action(state === "setup" ? "Resume setup" : "Run setup again")}${action("Rollback")}</div></div>`)}${section("Plugin Doctor", "Details expand only when something needs attention.", state === "degraded" ? `<div class="solcord-recovery-row"><div><strong>One addon needs review.</strong><p>It is quarantined and will not re-enable silently.</p></div>${action("Review addon", "danger")}</div>` : allClear)}<details class="solcord-secondary-tools"><summary>About and technical information</summary><dl class="solcord-facts"><div><dt>Runtime</dt><dd>Solcord V2 fixture</dd></div><div><dt>Diagnostics</dt><dd>Content-free</dd></div></dl></details>`
    };

    const setupScreen = () => `<section class="solcord-wizard" aria-labelledby="solcord-setup-title"><div class="solcord-wizard-title"><div><p class="solcord-eyebrow">First setup</p><h2 id="solcord-setup-title">Set up Solcord</h2><p>Five quick steps. Nothing changes until Apply.</p></div><span>2 / 5</span></div><div class="solcord-wizard-progress" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2"><span style="width:40%"></span></div><ol class="solcord-wizard-steps"><li><button type="button" aria-label="1. Welcome"><span aria-hidden="true">1</span><span>Welcome</span></button></li><li><button type="button" aria-label="2. Privacy, current step" aria-current="step"><span aria-hidden="true">2</span><span>Privacy</span></button></li><li><button type="button" aria-label="3. Appearance"><span aria-hidden="true">3</span><span>Appearance</span></button></li><li><button type="button" aria-label="4. Features"><span aria-hidden="true">4</span><span>Features</span></button></li><li><button type="button" aria-label="5. Review and Apply"><span aria-hidden="true">5</span><span>Review and Apply</span></button></li></ol><div class="solcord-wizard-body"><h3>Choose your privacy baseline</h3><p>Strict Privacy blocks verified optional reporting. Discord essentials keep working.</p><div class="solcord-choice-grid solcord-choice-grid-two"><label class="solcord-choice-row"><input type="radio" name="privacy" checked><span><strong>Strict Privacy</strong><small>Recommended. Optional reporting and activity discovery stay off.</small></span></label><label class="solcord-choice-row"><input type="radio" name="privacy"><span><strong>Standard</strong><small>Discord optional reporting may run.</small></span></label></div></div><div class="solcord-wizard-footer"><div class="solcord-actions">${action("Back")}${action("Continue", "accent")}<button type="button" class="solcord-text-button">Finish later</button></div><p class="solcord-setup-status" role="status"></p></div></section>`;

    content.innerHTML = state === "wizard" ? setupScreen() : screens[workspace]();
    if (switchMatrix) content.insertAdjacentHTML("beforeend", section("Switch states", "Canonical off, on, disabled, hover, and keyboard-focus geometry.", `<div class="solcord-setting-list" data-switch-matrix>${toggle("Off state", "Gray track with a visible white thumb.")}${toggle("On state", "Teal track with the same visible white thumb.", true)}<div class="solcord-setting-row"><span><strong>Disabled state</strong><small>Still legible and visibly unavailable.</small></span>${switchControl("Disabled state", false, true)}</div></div>`));
    if (switchMatrix || workspace === "appearance") content.insertAdjacentHTML("beforeend", section("Reading width", "One focus indicator and a full-width track below its label.", `<div class="solcord-control-grid" data-range-matrix><label class="solcord-range-field"><span>${longCopy ? "Width of the message reading area with a long translated label" : "Reading width"}<output>Discord default</output></span><input type="range" aria-label="Reading width" min="0" max="19" value="0" aria-valuetext="Discord default"></label></div>`));
    content.dataset.workspace = workspace;
    document.querySelectorAll("[data-workspace]").forEach(button => button.setAttribute("aria-current", button.dataset.workspace === workspace ? "page" : "false"));
    document.querySelector(".solcord-workspace-menu > summary").setAttribute("aria-label", `Change workspace. Current workspace: ${workspaceNames[workspace][0]}`);
    document.querySelector(".solcord-workspace-menu > summary").textContent = `Workspace: ${workspaceNames[workspace][0]}`;

    const colorContext = document.createElement("canvas").getContext("2d", {willReadFrequently: true});
    colorContext.canvas.width = 1;
    colorContext.canvas.height = 1;
    const rgba = (value) => {
        colorContext.clearRect(0, 0, 1, 1);
        colorContext.fillStyle = "rgba(0, 0, 0, 0)";
        colorContext.fillStyle = value;
        colorContext.fillRect(0, 0, 1, 1);
        const [red, green, blue, alpha] = colorContext.getImageData(0, 0, 1, 1).data;
        return [red, green, blue, alpha / 255];
    };
    const blend = (foreground, background) => {
        const alpha = foreground[3] + background[3] * (1 - foreground[3]);
        if (!alpha) return [0, 0, 0, 0];
        return [
            (foreground[0] * foreground[3] + background[0] * background[3] * (1 - foreground[3])) / alpha,
            (foreground[1] * foreground[3] + background[1] * background[3] * (1 - foreground[3])) / alpha,

    };
    const effectiveBackground = (element) => {
        const layers = [];

    const luminance = (value) => value.slice(0, 3).map(channel => {

    const contrast = (foreground, background) => {

        const b = luminance(background);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    };
    const elementContrast = (element) => contrast(rgba(getComputedStyle(element).color), effectiveBackground(element));
    const visible = (element) => {
        if (element.closest(".sr-only")) return false;
        const closedDisclosure = element.closest("details:not([open])");
        if (closedDisclosure && element !== closedDisclosure.querySelector(":scope > summary")) return false;
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
    };
    const inspect = () => {
        const panel = document.querySelector(".solcord-panel");
        const panelRect = panel.getBoundingClientRect();
        const visibleElements = [...panel.querySelectorAll("*")].filter(visible);
        const overflow = visibleElements.filter(element => {
            const rect = element.getBoundingClientRect();
            return rect.left < panelRect.left - 1 || rect.right > panelRect.right + 1 || element.scrollWidth > element.clientWidth + 1;
        }).map(element => element.className || `${element.tagName}${element.parentElement?.className ? ` in ${element.parentElement.className}` : ""}`).slice(0, 20);
        const focusables = [...panel.querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), summary, [href], [tabindex]:not([tabindex='-1'])")].filter(visible);
        const focusFailures = focusables.filter(element => { element.focus({preventScroll: true}); return document.activeElement !== element; }).map(element => element.outerHTML.slice(0, 80));
        const headingCopy = panel.querySelector(".solcord-workspace-heading p, .solcord-wizard-title p");
        const navButton = panel.querySelector(".solcord-workspace-nav button");
        const settingTitle = panel.querySelector(".solcord-setting-row strong");
        const settingCopy = panel.querySelector(".solcord-setting-row small");
        const navElement = document.querySelector(".solcord-workspace-nav");
        const searchElement = document.querySelector(".solcord-workspace-search");
        const menuElement = document.querySelector(".solcord-workspace-menu");
        const nav = navElement.getBoundingClientRect();
        const area = content.getBoundingClientRect();
        const horizontalOverlap = Math.max(0, Math.min(nav.right, area.right) - Math.max(nav.left, area.left));
        const verticalOverlap = Math.max(0, Math.min(nav.bottom, area.bottom) - Math.max(nav.top, area.top));
        const sideBySide = nav.right <= area.left + 1;
        const stacked = nav.bottom <= area.top + 1;
        const nativeRowSpacingFailures = [...document.querySelectorAll("[data-native-layout]")].flatMap(row => {
            const title = row.querySelector(".solcord-native-title")?.getBoundingClientRect();
            const replacement = row.querySelector(".solcord-native-replaces")?.getBoundingClientRect();
            const status = row.querySelector(".solcord-capability")?.getBoundingClientRect();
            if (!title || !replacement || !status) return ["missing-column"];
            const overlaps = (left, right) => Math.min(left.right, right.right) > Math.max(left.left, right.left) && Math.min(left.bottom, right.bottom) > Math.max(left.top, right.top);
            if (overlaps(title, replacement) || overlaps(replacement, status) || overlaps(title, status)) return [row.textContent.trim().slice(0, 80)];
            if (replacement.top < title.bottom && replacement.left - title.right < 8) return [row.textContent.trim().slice(0, 80)];
            if (status.top < replacement.bottom && status.left - replacement.right < 8) return [row.textContent.trim().slice(0, 80)];
            return [];
        });
        const settingHintSpacingFailures = [...panel.querySelectorAll("label:has(> .solcord-switch)")].flatMap(label => {
            const hint = label.nextElementSibling;
            if (!hint?.classList.contains("solcord-key-hint") || !visible(label) || !visible(hint)) return [];
            const labelRange = document.createRange();

            const labelBottom = Math.max(label.getBoundingClientRect().bottom, ...[...labelRange.getClientRects()].map(rect => rect.bottom));
            const hintTop = Math.min(hint.getBoundingClientRect().top, ...[...hint.querySelectorAll("kbd")].map(key => key.getBoundingClientRect().top));
            return hintTop - labelBottom < 7 ? [label.textContent.trim()] : [];
        });
        const actionHintSpacingFailures = [...panel.querySelectorAll(".solcord-actions, .solcord-dialog-actions, .solcord-inline-field, .solcord-control-grid")].flatMap(controls => {
            const note = controls.nextElementSibling;
            if (note?.tagName !== "P" || !visible(controls) || !visible(note)) return [];
            const expectedGap = parseFloat(getComputedStyle(panel).getPropertyValue("--sc-space-3"));
            const gap = note.getBoundingClientRect().top - controls.getBoundingClientRect().bottom;
            return gap < expectedGap - 1 ? [{note: note.textContent.trim(), gap}] : [];
        });
        const compactNavigation = getComputedStyle(document.querySelector(".solcord-workspace-nav-list")).display === "none";
        const compactNavigationGeometry = compactNavigation ? {
            searchHidden: getComputedStyle(searchElement).display === "none",
            menuVisible: visible(menuElement.querySelector(":scope > summary")),
            opaqueBackground: rgba(getComputedStyle(navElement).backgroundColor)[3] === 1,
            singleColumn: getComputedStyle(navElement).gridTemplateColumns.trim().split(/\s+/).length === 1
        } : null;
        const diagnosticWarningVisible = [...document.querySelectorAll(".solcord-build-warning")].some(visible);
        // Dialog: exactly one identity title, the dialog inside the window, and
        // the setup actions reachable without scrolling in short windows.
        const dialogElement = document.querySelector(".solcord-control-center-dialog");
        const dialogGeometry = dialogElement ? (() => {
            const scroller = dialogElement.querySelector(".solcord-control-center-dialog-content").getBoundingClientRect();
            const box = dialogElement.getBoundingClientRect();
            const identityTitles = [dialogElement.querySelector(".solcord-control-center-dialog-header h2"), panel.querySelector(".solcord-header h1")].filter(element => element && visible(element)).length;
            const setupActions = [...panel.querySelectorAll(".solcord-wizard-footer .solcord-action")].filter(visible);
            const actionsInView = setupActions.every(action => {
                const rect = action.getBoundingClientRect();
                return rect.top >= scroller.top - 1 && rect.bottom <= Math.min(scroller.bottom, innerHeight) + 1;
            });
            return {identityTitles, setupActionCount: setupActions.length, actionsInView, insideWindow: box.top >= -1 && box.bottom <= innerHeight + 1 && box.left >= -1 && box.right <= innerWidth + 1};
        })() : null;
        // One switch pattern: the switch is the last thing in its row, sits at the
        // row's end, rows stay within the shared measure, and switches line up.
        const rowMeasure = parseFloat(getComputedStyle(panel).getPropertyValue("--sc-row-measure"));
        const placedSwitches = [...panel.querySelectorAll(".solcord-switch")].filter(visible).filter(control => !control.closest(".solcord-toggle"));
        const switchPlacementFailures = placedSwitches.flatMap(control => {
            const row = control.closest(".solcord-setting-row, label, .solcord-power-control, .solcord-history-switch");
            const name = control.querySelector("input")?.getAttribute("aria-label") || "switch";
            if (!row) return [`${name}: no-row`];
            const rowBox = row.getBoundingClientRect();
            const box = control.getBoundingClientRect();
            const failures = [];
            if (row.lastElementChild !== control && !control.parentElement.classList.contains("solcord-builtin-control")) failures.push(`${name}: switch-not-after-label`);
            if (rowBox.right - box.right > 22) failures.push(`${name}: switch-not-at-row-end`);
            if (!(rowMeasure > 0) || rowBox.width > rowMeasure + 1) failures.push(`${name}: row-wider-than-measure`);
            return failures;
        });
        const switchEdges = placedSwitches.map(control => control.getBoundingClientRect().right);
        const switchEdgeSpread = switchEdges.length ? Number((Math.max(...switchEdges) - Math.min(...switchEdges)).toFixed(2)) : 0;
        // Setup rail: every step name visible and unclipped, the rail aligned with
        // the progress bar, and number badges level within each row of steps.
        const progressBar = panel.querySelector(".solcord-wizard-progress");
        const stepRail = panel.querySelector(".solcord-wizard-steps");
        const wizardStepFailures = progressBar && stepRail ? (() => {
            const failures = [];
            const bar = progressBar.getBoundingClientRect();
            const rail = stepRail.getBoundingClientRect();
            if (Math.abs(bar.left - rail.left) > 1 || Math.abs(bar.right - rail.right) > 1) failures.push("step-rail-not-aligned-with-progress");
            const rows = new Map();
            for (const button of stepRail.querySelectorAll("button")) {
                const label = button.querySelector("span:last-child");
                const buttonBox = button.getBoundingClientRect();
                const labelBox = label.getBoundingClientRect();
                if (!visible(label)) failures.push(`hidden-step-name: ${label.textContent}`);
                else if (label.scrollWidth > label.clientWidth + 1 || labelBox.left < buttonBox.left - 1 || labelBox.right > buttonBox.right + 1 || labelBox.bottom > buttonBox.bottom + 1) failures.push(`clipped-step-name: ${label.textContent}`);
                const rowKey = Math.round(button.closest("li").getBoundingClientRect().top);
                rows.set(rowKey, [...(rows.get(rowKey) ?? []), button.querySelector("span:first-child").getBoundingClientRect().top]);
            }
            for (const tops of rows.values()) if (Math.max(...tops) - Math.min(...tops) > 1) failures.push("step-badges-not-level");
            return failures;
        })() : [];
        const switchStateFailures = [...document.querySelectorAll(".solcord-switch")].flatMap(control => {
            const input = control.querySelector("input[role='switch']");
            const track = control.querySelector(".solcord-switch-track");
            const thumb = control.querySelector(".solcord-switch-thumb");
            if (!input || !track || !thumb) return ["missing-switch-part"];
            const trackRect = track.getBoundingClientRect();
            const thumbRect = thumb.getBoundingClientRect();
            const thumbColor = rgba(getComputedStyle(thumb).backgroundColor);
            if (trackRect.width < 36 || trackRect.height < 20 || thumbRect.width < 14 || thumbRect.height < 14) return [input.getAttribute("aria-label") || "switch-geometry"];
            if (trackRect.width / trackRect.height < 1.5 || trackRect.width / trackRect.height > 2) return ["switch-track-aspect-ratio"];
            if (thumbRect.left < trackRect.left || thumbRect.right > trackRect.right || thumbRect.top < trackRect.top || thumbRect.bottom > trackRect.bottom) return ["switch-thumb-outside-track"];
            if (thumbColor[0] < 245 || thumbColor[1] < 245 || thumbColor[2] < 245 || thumbColor[3] < 1) return [input.getAttribute("aria-label") || "switch-thumb"];
            if (input.checked && getComputedStyle(thumb).transform === "none") return [input.getAttribute("aria-label") || "switch-on-position"];
            if (input.disabled && Number(getComputedStyle(track).opacity) >= 1) return [input.getAttribute("aria-label") || "switch-disabled"];
            return [];
        });
        let switchFocusVisible = true;
        const focusSwitch = document.querySelector(".solcord-switch > input:not(:disabled)");
        if (focusSwitch) {
            document.body.dispatchEvent(new KeyboardEvent("keydown", {key: "Tab", bubbles: true}));
            focusSwitch.focus({preventScroll: true});
            const focusTrack = focusSwitch.nextElementSibling;
            switchFocusVisible = focusTrack && parseFloat(getComputedStyle(focusTrack).outlineWidth) >= 2;
        }
        const disclosureFocusFailures = [...panel.querySelectorAll("summary")].filter(visible).flatMap(summary => {
            summary.focus({preventScroll: true});
            const style = getComputedStyle(summary);
            const color = rgba(style.outlineColor);
            const focusContrast = contrast(color, effectiveBackground(summary.parentElement));
            return document.activeElement !== summary || !summary.matches(":focus-visible") || style.outlineStyle === "none" || parseFloat(style.outlineWidth) < 2 || color[3] < 1 || focusContrast < 3
                ? [{label: summary.textContent.trim(), outline: style.outline, contrast: Number(focusContrast.toFixed(2))}]
                : [];
        });
        const rangeLayoutFailures = [...panel.querySelectorAll("[data-range-matrix] .solcord-range-field")].flatMap(field => {
            const label = field.querySelector(":scope > span");
            const input = field.querySelector("input");
            input.focus({preventScroll: true});
            const labelBox = label.getBoundingClientRect();
            const trackBox = input.getBoundingClientRect();
            const focus = getComputedStyle(input);
            const failures = [];
            if (getComputedStyle(field).display !== "grid" || trackBox.top - labelBox.bottom < 7) failures.push("slider-label-not-above-track");
            if (Math.abs(labelBox.width - trackBox.width) > 1) failures.push("slider-track-not-full-width");
            const parentFocus = getComputedStyle(field);
            if (parentFocus.outlineStyle !== "none" && parseFloat(parentFocus.outlineWidth) > 0) failures.push(`duplicate-slider-focus-outline: ${parentFocus.outline}`);
            if (focus.outlineStyle === "none" || parseFloat(focus.outlineWidth) < 2) failures.push("missing-slider-focus-outline");
            return failures;
        });
        const result = {
            scenario: {workspace, state, diagnostic, mode: document.documentElement.dataset.solcordMode, theme: document.documentElement.dataset.solcordFixtureTheme, motion: document.documentElement.dataset.solcordEffectiveMotion, scale: Number(document.documentElement.dataset.solcordFixtureScale), width: innerWidth, height: innerHeight, devicePixelRatio},
            horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
            clippedOrOverflowingElements: overflow,
            focusableCount: focusables.length,
            focusFailures,
            workspaceHeadingCount: content.querySelectorAll(":scope > .solcord-workspace-heading").length,
            nativeRowSpacingFailures,
            settingHintSpacingFailures,
            actionHintSpacingFailures,
            switchStateFailures,
            switchFocusVisible,
            disclosureFocusFailures,
            rangeLayoutFailures,
            diagnosticIdentity: {requested: diagnostic, warningVisible: diagnosticWarningVisible},
            dialogGeometry,
            switchPlacementFailures,
            switchEdgeSpread,
            wizardStepFailures,
            navigationRelationship: {sideBySide, stacked, horizontalOverlap: Number(horizontalOverlap.toFixed(2)), verticalOverlap: Number(verticalOverlap.toFixed(2))},
            compactNavigationGeometry,
            contrast: {
                normal: Number(elementContrast(panel).toFixed(2)),
                muted: Number(elementContrast(headingCopy).toFixed(2)),
                navigation: Number(elementContrast(navButton).toFixed(2)),
                settingTitle: settingTitle ? Number(elementContrast(settingTitle).toFixed(2)) : null,
                settingCopy: settingCopy ? Number(elementContrast(settingCopy).toFixed(2)) : null
            },
            reducedMotion: document.documentElement.dataset.solcordEffectiveMotion === "reduced" ? getComputedStyle(focusables[0]).transitionDuration : "not-requested"
        };
        const expectedHeadingCount = state === "wizard" ? 0 : 1;
        const contrastSamples = Object.values(result.contrast).filter(value => value !== null);
        const compactNavigationPass = !compactNavigationGeometry || Object.values(compactNavigationGeometry).every(Boolean);
        const dialogPass = !dialogGeometry || (dialogGeometry.identityTitles === 1 && dialogGeometry.actionsInView && dialogGeometry.insideWindow && (state !== "wizard" || dialogGeometry.setupActionCount === 2));
        result.pass = !result.horizontalOverflow && !overflow.length && !focusFailures.length && !result.nativeRowSpacingFailures.length && !result.settingHintSpacingFailures.length && !result.actionHintSpacingFailures.length && !result.switchStateFailures.length && result.switchFocusVisible && !result.disclosureFocusFailures.length && !rangeLayoutFailures.length && result.workspaceHeadingCount === expectedHeadingCount && result.diagnosticIdentity.warningVisible === diagnostic && contrastSamples.every(value => value >= 4.5) && (sideBySide || stacked) && compactNavigationPass && dialogPass && !switchPlacementFailures.length && switchEdgeSpread <= 16 && !wizardStepFailures.length;
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(result))));
        document.body.dataset.fixtureResult = encoded;
        document.querySelector("#fixture-result").textContent = JSON.stringify(result, null, 2);
        document.activeElement?.blur();
    };

        const detail = error instanceof Error ? `${error.name}: ${error.message}\n${error.stack || ""}` : String(error);
        document.body.dataset.fixtureError = btoa(unescape(encodeURIComponent(detail)));
    };

    // acceptance snapshot. Never publish a transient pre-font result as final.
    (async () => {
        try {
            await document.fonts.ready;
            // --dump-dom can suppress animation callbacks. A task after font
            // readiness plus a forced layout uses the same settled metrics.
            await new Promise(resolve => setTimeout(resolve, 0));
            document.body.getBoundingClientRect();
            inspect();
        }
        catch (error) {publishFixtureError(error);}
    })();
